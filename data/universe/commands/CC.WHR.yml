# Kali Liao raised this House in secret with the Word of Blake's Precentor Martial
# Cameron St. Jamais, out of her Thuggee cult and the Manei Domini. She was in no legal
# position to raise a Warrior House, so it answers to her rather than to the Warrior House
# Orders and does not fall back on them.
#
# Its record of service gives the Capellan Confederation and the Shadow Divisions as its
# two sources of equipment, which is what the two fallback factions here reproduce - the
# generator averages them, so the House draws on both rather than either.
#
# Despite the Blakist equipment it was a Capellan formation and used Inner Sphere lances,
# companies and battalions rather than the Word of Blake's base-six organisation, so it
# declares its own sizes rather than inheriting anything from the Blakist side.
#
# Raised from Blakist Manei Domini rather than Thuggee-raised soldiers, which is what
# separates it from its sister House. Destroyed on Sian in January 3074 when House
# White Tiger turned on it; no member is believed to have survived.

