key: CGS
name: Clan Goliath Scorpion
# Pinned explicitly so Faction2.getRankSystem() does not iterate fallBackFactions; CLAN tag
# factions all use the shared CLAN rank table.
rankSystem: CLAN
sucsCodes:
  - CGS
  - EI
  - SE
nameChanges:
  3080: Escorpión Imperio
  3141: Scorpion Empire
# This file is the consolidation of the former Escorpion Imperio (CEI, from 3080) and Scorpion Empire
# (SE, from 3141) faction files - a single entity renamed across eras. The retired faction codes are
# kept as aliases so existing campaign saves, planetary ownership and RAT availability tables that
# still reference CEI or SE resolve to CGS. See Faction2.getAliases().
aliases:
  3080: CEI
  3141: SE
capital: Roche
capitalChanges:
  3080: Granada
yearsActive:
  - start: 2807
tags:
  - PLAYABLE
  - MINOR
  - CLAN
  - BATCHALL
color:
  red: 104
  green: 125
  blue: 11
logo: Clan/Clan Goliath Scorpion.png
# Era-correct art: the faction shows the Escorpion Imperio emblem from 3080 (Imperio and Scorpion
# Empire eras); the base Goliath Scorpion emblem applies before then. See Faction2.getLogo(int).
